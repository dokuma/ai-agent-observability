# ===========================================================
# Global
# ===========================================================
global:
  # OpenShift 内部レジストリ（例: image-registry.openshift-image-registry.svc:5000）
  imageRegistry: "image-registry.openshift-image-registry.svc:5000"
  imageNamespace: "ai-monitoring"

# ===========================================================
# AI Agent (FastAPI + LangGraph)
# ===========================================================
agent:
  replicaCount: 1
  image:
    name: ai-agent-monitoring
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # コンテナの CMD を上書き（オフライン環境で uv run を回避）
  command: [".venv/bin/uvicorn"]
  args: ["ai_agent_monitoring.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  startupProbe:
    httpGet:
      path: /api/v1/health
      port: http
    periodSeconds: 10
    failureThreshold: 18  # 最大180秒の起動猶予
  livenessProbe:
    httpGet:
      path: /api/v1/health
      port: http
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: http
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # 追加の環境変数（プロキシ設定など）
  # extraEnv:
  #   - name: HTTPS_PROXY
  #     value: "http://proxy.example.com:8080"
  #   - name: HTTP_PROXY
  #     value: "http://proxy.example.com:8080"
  #   - name: NO_PROXY
  #     value: "localhost,127.0.0.1,.svc.cluster.local"
  extraEnv: []
  # 永続ボリューム（ReportStore DB, Datasource Preferences 等）
  persistence:
    enabled: true
    # storageClass: ""  # 空の場合はデフォルトの StorageClass を使用
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /app/data
  # MCP サーバーの起動完了を待つ initContainer（docker-compose の depends_on 相当）
  # Kubernetes では Pod の起動順序が保証されないため、Agent 起動前に
  # 各 MCP サーバーの readiness を確認する。
  # 無効の場合でも Agent は MCP サーバーの不在を graceful に処理するが、
  # 初回調査時のヘルスチェックリフレッシュが必要になる。
  waitForMcpServers:
    enabled: true
    image: "busybox:1.36"
    # タイムアウト（秒）— この時間を超えると initContainer は失敗する
    timeoutSeconds: 120

# ===========================================================
# Prometheus MCP Server
# ===========================================================
prometheusMcp:
  replicaCount: 1
  # サーバー側トランスポート（prometheus-mcp-server が受け付ける方式: http / sse / stdio）
  transport: "http"
  image:
    name: prometheus-mcp-server
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# ===========================================================
# Loki MCP Server
# ===========================================================
lokiMcp:
  replicaCount: 1
  image:
    name: loki-mcp-server
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# ===========================================================
# grafana-mcp 依存チャート上書き
# ===========================================================
grafana-mcp:
  enabled: true
  # 親チャートの ServiceAccount を共有（独自SA作成するとSCC未付与でFailedCreateになる）
  serviceAccount:
    create: false
    name: "ai-agent-monitoring"  # 親チャートの SA 名（= release名）に合わせる
  grafana:
    url: "http://grafana.monitoring.svc.cluster.local:3000"
    apiKeySecret:
      # 親チャートの Secret 名を指定する（<release-name>-ai-agent-monitoring-secret）
      # helm install 時に --set grafana-mcp.grafana.apiKeySecret.name=<secret名> で上書き可能
      name: "ai-agent-monitoring-secret"
      key: GRAFANA_SERVICE_ACCOUNT_TOKEN
  service:
    type: ClusterIP
    port: 8000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

# ===========================================================
# kubernetes-mcp-server 依存チャート上書き
# ===========================================================
kubernetes-mcp-server:
  enabled: true
  image:
    # デフォルト: quay.io/containers/kubernetes_mcp_server:latest
    # OpenShift 内部レジストリ使用時は global.imageRegistry/global.imageNamespace を参照して書き換える
    registry: "quay.io"
    repository: "containers/kubernetes_mcp_server"
    version: "latest"
    pullPolicy: IfNotPresent
  # 親チャートの ServiceAccount を共有（OpenShift SCC 対応）
  serviceAccount:
    create: false
    name: "ai-agent-monitoring"
  # RBAC — 読み取り専用アクセス
  rbac:
    create: true
    extraClusterRoleBindings:
      # 組み込みの view ClusterRole（Pod, Deployment, Service, ConfigMap, Event 等の読み取り）
      - name: view
        roleRef:
          name: view
          external: true
  # read_only モードで起動
  config:
    port: "8080"
    read_only: true
    log_level: 3
  service:
    type: ClusterIP
    port: 8080
  # プローブ設定（他の MCP サーバーと同等の設定）
  # Go バイナリの起動完了を待つため initialDelaySeconds を設定
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # クラスタ内アクセスのみ（Ingress不要）
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # OpenShift restricted SCC 準拠
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true

# ===========================================================
# Qdrant 依存チャート上書き (qdrant/qdrant-helm)
# ===========================================================
qdrant:
  enabled: false
  replicaCount: 1
  # Qdrant 設定（production.yaml に書き出される）
  config:
    # 匿名利用統計の外部送信を無効化（クローズドネットワーク環境向け）
    telemetry_disabled: true
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # OpenShift restricted SCC 準拠
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true

# ===========================================================
# 外部サービス接続先
# ===========================================================
externalServices:
  llm:
    endpoint: "http://ollama.ai-monitoring.svc.cluster.local:11434/v1"
    model: "qwen2.5:0.5b"
    verifySsl: true
    maxRetries: 5
  prometheus:
    url: "http://prometheus.monitoring.svc.cluster.local:9090"
  loki:
    url: "http://loki.monitoring.svc.cluster.local:3100"
  grafana:
    url: "http://grafana.monitoring.svc.cluster.local:3000"
  langfuse:
    enabled: true
    baseUrl: "http://langfuse-web.ai-monitoring.svc.cluster.local:3000"

# ===========================================================
# ConfigMap 設定値（非機密）
# ===========================================================
config:
  maxIterations: "5"
  investigationTimeoutSeconds: "120"
  reportSearchTimeoutSeconds: "120"
  corsAllowedOrigins: '["http://localhost:3000"]'
  # MCP Transport（"sse" or "streamable_http"）
  mcpTransport: "sse"                          # グローバルデフォルト
  mcpGrafanaTransport: ""                      # 空の場合は mcpTransport を使用
  mcpPrometheusTransport: "streamable_http"    # prometheus-mcp の "http" transport に対応
  mcpLokiTransport: ""
  mcpKubernetesTransport: "sse"               # Go SDK は SSE を推奨（Streamable HTTP は互換性問題あり）
  # ログレベル（DEBUG, INFO, WARNING, ERROR）
  logLevel: "INFO"
  # OpenAI SDK デバッグログ（"debug" で有効、空で無効）
  openaiLog: ""
  mcpUseTls: "false"
  mcpVerifySsl: "true"
  mcpCaBundle: ""
  # Qdrant / Embedding
  qdrantEnabled: "false"
  embeddingEndpoint: ""  # 空の場合は LLM_ENDPOINT を使用
  embeddingModel: "text-embedding-3-small"
  embeddingDimensions: "0"
  # Search-First: レポート検索のスコア閾値（BM25スコアがこの値を超えれば検索結果で回答）
  searchRelevanceThreshold: "0.3"

# ===========================================================
# Secret 設定値（機密）
# ===========================================================
secrets:
  # 既存 Secret を参照する場合はここに名前を設定
  existingSecret: ""
  # existingSecret が空の場合、以下の値で Secret を自動生成
  llmApiKey: "not-needed"
  # LLMカスタムヘッダー（環境変数 LLM_CUSTOM_HEADER_<KEY> として注入）
  # ヘッダー名のハイフンはアンダースコアに変換される（例: Authorization → LLM_CUSTOM_HEADER_AUTHORIZATION）
  # llmCustomHeaders:
  #   Authorization: "Bearer eyJhbG..."
  #   X-Custom-Header: "my-value"
  llmCustomHeaders: {}
  embeddingApiKey: ""
  grafanaApiKey: ""
  grafanaServiceAccountToken: ""
  slackWebhookUrl: ""
  langfusePublicKey: ""
  langfuseSecretKey: ""

# ===========================================================
# ServiceAccount
# ===========================================================
serviceAccount:
  create: true
  # 空の場合、fullname から自動生成
  name: ""
  annotations: {}

# ===========================================================
# RBAC — ClusterRoleBinding
# ===========================================================
rbac:
  # ClusterRoleBinding の作成を有効にする
  enabled: false
  # バインドする ClusterRole のリスト（環境に合わせて名前を変更可能）
  clusterRoleBindings:
    - clusterRoleName: cluster-monitoring-view
    - clusterRoleName: cluster-reader
    - clusterRoleName: system:auth-delegator
    - clusterRoleName: thanos-querier
    - clusterRoleName: grafana-loki-logs-reader

# ===========================================================
# Security Context（OpenShift restricted SCC 準拠）
# ===========================================================
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false
  runAsNonRoot: true

# ===========================================================
# 共通設定
# ===========================================================
imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}
